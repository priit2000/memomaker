<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>memomaker</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="brand"><i data-lucide="audio-lines"></i><strong>memomaker</strong></div><span class="tagline">Turn conversations into clarity.</span><button id="settings-open"><i data-lucide="settings"></i>API settings</button></header>
<main>
 <section class="setup panel">
  <div class="intro"><h1>New memo</h1><p>Add audio, fine-tune your prompts, and create.</p></div>
  <div class="setup-scroll">
   <section class="audio framed"><h2>Audio file</h2><button id="drop-zone" class="drop-zone"><i data-lucide="cloud-upload"></i><span>Drop an audio file here</span><small>or <b>browse files</b></small></button>
    <div class="selected-file" id="selected-file" hidden><span class="file-icon"><i data-lucide="music-2"></i></span><div><strong id="file-name"></strong><span id="file-size"></span></div><button id="clear-file" class="icon-button" title="Remove file"><i data-lucide="circle-x"></i></button></div>
   </section>
   <section class="processing framed"><div class="section-heading"><h2>Processing</h2><select id="source" aria-label="Processing mode"><option value="audio">Audio to transcript and memo</option><option value="transcript-only">Audio to transcript only</option><option value="transcript">Existing transcript to memo</option></select></div><div class="segments" id="methods"><button data-method="auto">Auto</button><button class="active" data-method="inline">Inline</button><button data-method="upload">Upload</button></div><div id="provider-summary" hidden></div><details id="audio-limits-panel"><summary>Audio limits</summary><div id="audio-limits" class="audio-limits"></div></details></section>
   <section class="prompts framed"><div class="section-heading"><h2>Prompts</h2><select id="profile" aria-label="Prompt profile"></select></div><nav class="tabs prompt-tabs"><button data-prompt="0" class="active">Transcript</button><button data-prompt="1">Memo</button></nav><textarea id="prompt-editor" aria-label="Prompt"></textarea><div class="prompt-actions"><button id="save-prompts" class="icon-button" title="Save both prompts to profile"><i data-lucide="save"></i></button><button id="reset" class="text-button"><i data-lucide="rotate-ccw"></i>Reset to default</button></div></section>
  </div>
  <button id="generate" class="primary"><i data-lucide="sparkles"></i>Generate memo</button>
 </section>
 <section class="workspace panel"><h1>Your workspace</h1><div class="workspace-toolbar"><nav class="tabs output-tabs"><button class="active" data-output="memo">Memo</button><button data-output="transcript">Transcript</button></nav><div class="output-actions"><button id="load-output" class="icon-button" title="Load memo"><i data-lucide="folder-open"></i></button><button id="edit" class="icon-button" title="Edit output" hidden><i data-lucide="pencil"></i></button><button id="copy"><i data-lucide="copy"></i>Copy</button><button id="export"><i data-lucide="download"></i>Export<i data-lucide="chevron-down" class="small-icon"></i></button></div></div>
 <div class="speaker-toolbar"><button id="speakers-toggle" class="text-button" disabled><i data-lucide="users-round"></i>Speakers</button><button id="speakers-undo" class="icon-button" title="Undo speaker name changes" hidden><i data-lucide="undo-2"></i></button></div>
 <section id="speakers-panel" hidden><form id="speakers-form"><div class="section-heading"><h2>Speaker names</h2><button id="speakers-close" type="button" class="icon-button" title="Close speaker names"><i data-lucide="x"></i></button></div><div id="speaker-rows"></div><div class="speaker-actions"><button id="speaker-add" type="button" class="icon-button" title="Add speaker name"><i data-lucide="plus"></i></button><span id="speaker-status" role="status"></span><button class="primary" type="submit">Apply names</button></div></form></section>
 <div class="document" id="document"><article id="preview"></article><textarea id="output-editor" aria-label="Edit output" hidden></textarea></div>
 </section>
</main>
<footer><span class="status-dot"></span><span id="status" role="status">Ready to process</span><div id="job-progress" hidden><progress id="progress" max="4" value="0" aria-label="Completed processing stages"></progress><span id="progress-label"></span><span id="elapsed"></span></div><button class="text-button" id="activity-toggle">Activity log<i data-lucide="chevron-right"></i></button></footer>
<aside id="activity" hidden><div><h2>Activity log</h2><button class="icon-button" id="activity-close" title="Close activity"><i data-lucide="x"></i></button></div><pre id="log"></pre></aside>
<dialog id="settings"><form id="settings-form"><div class="modal-heading"><h1>API settings</h1><button type="button" class="icon-button" id="settings-close" title="Close settings"><i data-lucide="x"></i></button></div>
 <div id="stages"></div>
 <div class="credentials"><label>Google Gemini key<input id="GEMINI_API_KEY" type="password" autocomplete="off"></label><label>OpenRouter key<input id="OPENROUTER_API_KEY" type="password" autocomplete="off"></label><label>Custom API key<input id="CUSTOM_API_KEY" type="password" autocomplete="off"></label><label>Custom base URL<input id="base_url" type="url" placeholder="http://localhost:8000/v1"></label><label>Custom audio endpoint<select id="audio_mode"><option value="chat">Chat audio messages</option><option value="transcriptions">Audio transcriptions (multipart)</option></select></label></div>
 <label class="remember"><input type="checkbox" id="remember">Remember keys in Windows user environment</label><div class="modal-footer"><span id="settings-status"></span><button class="primary">Apply settings</button></div></form></dialog>
<script src="lucide.min.js"></script><script src="marked.min.js"></script><script src="purify.min.js"></script><script src="audio-limits.js"></script><script src="app.js"></script><script src="workspace-tools.js"></script>
</body></html>
